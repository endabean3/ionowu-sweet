<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Cocoa Drop Shadow -->
    <filter id="cakeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#2D231E"/>
    </filter>
    <linearGradient id="spongeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="creamBerry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA4B6"/>
      <stop offset="100%" stop-color="#FF5A82"/>
    </linearGradient>
  </defs>

  <!-- Plate Saucer -->
  <ellipse cx="60" cy="102" rx="48" ry="9" fill="#FFA4B6" fill-opacity="0.6" stroke="#2D231E" stroke-width="2.5"/>

  <!-- Cake Body Slice -->
  <g filter="url(#cakeShadow)">
    <!-- Base Bottom Sponge -->
    <path d="M22 68 L88 44 L98 64 L30 92 Z" fill="url(#spongeTop)" stroke="#2D231E" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Strawberry Jam Middle Layer -->
    <path d="M25 60 L89 40 L93 50 L27 72 Z" fill="url(#creamBerry)" stroke="#2D231E" stroke-width="2"/>

    <!-- Top Sponge Layer -->
    <path d="M28 50 L90 34 L93 42 L30 60 Z" fill="url(#spongeTop)" stroke="#2D231E" stroke-width="2"/>

    <!-- Whipped Cream Icing Top -->
    <path d="M30 42 C40 45 50 38 60 42 C70 46 80 38 92 34 L88 40 C78 44 68 38 58 42 C48 46 38 40 28 46 Z" fill="#FFFFFF" stroke="#2D231E" stroke-width="2"/>

    <!-- Fluffy Whipped Cream Swirls on Top -->
    <circle cx="48" cy="38" r="8" fill="#FFFFFF" stroke="#2D231E" stroke-width="2"/>
    <circle cx="62" cy="34" r="9" fill="#FFFFFF" stroke="#2D231E" stroke-width="2"/>
    <circle cx="76" cy="32" r="7" fill="#FFFFFF" stroke="#2D231E" stroke-width="2"/>

    <!-- Fresh Red Strawberry on Top -->
    <path d="M62 14 C52 14 50 26 62 34 C74 26 72 14 62 14 Z" fill="#E11D48" stroke="#2D231E" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Strawberry Leaves -->
    <path d="M62 14 C58 9 52 10 50 13 C54 15 58 14 62 14 Z" fill="#A2E8CE" stroke="#2D231E" stroke-width="1.5"/>
    <path d="M62 14 C66 9 72 10 74 13 C70 15 66 14 62 14 Z" fill="#A2E8CE" stroke="#2D231E" stroke-width="1.5"/>
    <path d="M62 14 C62 8 60 6 62 5 C64 6 63 9 62 14 Z" fill="#A2E8CE" stroke="#2D231E" stroke-width="1.5"/>

    <!-- Strawberry Seed Dots -->
    <circle cx="58" cy="20" r="1" fill="#FFEAA7"/>
    <circle cx="66" cy="22" r="1" fill="#FFEAA7"/>
    <circle cx="62" cy="27" r="1" fill="#FFEAA7"/>
  </g>
</svg>
