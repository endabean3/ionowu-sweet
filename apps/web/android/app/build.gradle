apply plugin: 'com.android.application'

// ── Penandatanganan rilis ────────────────────────────────────────────
//
// Play Store menolak APK/AAB debug: ia hanya menerima artefak yang
// ditandatangani keystore rilis. Kredensialnya TIDAK PERNAH masuk repo —
// dibaca dari `android/keystore.properties` (lokal, di-gitignore) atau dari
// environment (CI, lewat GitHub Secrets).
//
// Bila keystore tidak tersedia, build rilis tetap berjalan tetapi menghasilkan
// artefak TIDAK ditandatangani. Itu disengaja: pengembang tanpa keystore tetap
// bisa mengompilasi dan menguji, dan kegagalannya muncul saat upload — bukan
// berupa build yang gagal misterius di mesin orang lain.
//
// ⚠️ Keystore hilang = aplikasi TIDAK BISA diperbarui lagi di Play Store,
// selamanya. Cadangkan di luar mesin ini. Lihat 50-operations/PLAY-STORE.md.
def berkasKeystoreProps = rootProject.file("keystore.properties")
def propsKeystore = new Properties()
if (berkasKeystoreProps.exists()) {
    propsKeystore.load(new FileInputStream(berkasKeystoreProps))
}
def ksFile  = propsKeystore.getProperty("storeFile")     ?: System.getenv("ANDROID_KEYSTORE_FILE")
def ksPass  = propsKeystore.getProperty("storePassword") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
def ksAlias = propsKeystore.getProperty("keyAlias")      ?: System.getenv("ANDROID_KEY_ALIAS")
def ksKeyPass = propsKeystore.getProperty("keyPassword") ?: System.getenv("ANDROID_KEY_PASSWORD")
def adaKeystore = ksFile != null && ksPass != null && ksAlias != null && ksKeyPass != null

// Play Store menolak unggahan dengan versionCode yang sudah dipakai, jadi
// nilainya harus bisa dinaikkan dari luar (CI) tanpa mengedit berkas ini di
// setiap rilis.
def kodeVersi = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
def namaVersi = System.getenv("ANDROID_VERSION_NAME") ?: "1.0"

android {
    namespace = "id.ionowu.sweet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "id.ionowu.sweet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Dihitung di luar blok ini (lihat kodeVersi/namaVersi di atas).
        // Menulisnya inline sebagai `versionCode (X ?: "1").toInteger()`
        // TIDAK bekerja: Groovy mengurainya sebagai `versionCode(X)` lebih
        // dulu, lalu menerapkan sisanya pada hasil panggilan itu — sehingga
        // versionCode menerima null dan Gradle gagal "Value is null".
        // Ditemukan oleh gerbang android-build.yml, bukan setelah rilis.
        versionCode kodeVersi
        versionName namaVersi
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (adaKeystore) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (adaKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
