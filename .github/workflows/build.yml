# Bangun image SETELAH merge ke main, dorong ke ghcr.io.
# PR tidak membangun image — hemat menit CI, umpan balik lebih cepat.
# Rujukan: ADR-0004 · 15-development/CI-PIPELINE.md §3

name: Build & Push
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `context` dan `file` DIPISAH karena keduanya tidak selalu sama.
          # web adalah paket di dalam pnpm workspace: Dockerfile-nya menyalin
          # package.json + pnpm-lock.yaml + pnpm-workspace.yaml dari ROOT repo,
          # jadi context-nya WAJIB root. Dengan `context: ./apps/web`, build
          # gagal di baris COPY pertama ("/pnpm-workspace.yaml": not found) —
          # dikonfirmasi lewat `docker build` nyata, bukan dugaan.
          - { name: pos-engine,          context: ./services/pos-engine, file: ./services/pos-engine/Dockerfile }
          - { name: web,                 context: .,                     file: ./apps/web/Dockerfile }
          - { name: intelligence-worker, context: ./services/intelligence-worker, file: ./services/intelligence-worker/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - name: Lewati bila layanan belum ada
        id: cek
        run: |
          if [ -f "${{ matrix.file }}" ]; then echo "ada=true" >> $GITHUB_OUTPUT
          else echo "⏭️  ${{ matrix.name }} belum ada"; echo "ada=false" >> $GITHUB_OUTPUT; fi
      # IMG-10 — amd64 WAJIB (host produksi, x86_64). arm64 yang semula
      # "SEBAIKNYA" untuk mesin dev Apple Silicon DIHENTIKAN: dibangun lewat
      # QEMU di runner x86, dan terbukti macet (lihat komentar `platforms`).
      # Karena itu setup-qemu-action juga dihapus — tanpa target arm64 ia hanya
      # memperlambat job dan menyiratkan emulasi yang tidak lagi dipakai.
      # Mesin dev tidak butuh image arm64 dari registry: pengembangan berjalan
      # di dev container yang dibangun lokal.
      - uses: docker/setup-buildx-action@v4
        if: steps.cek.outputs.ada == 'true'
      - uses: docker/login-action@v4
        if: steps.cek.outputs.ada == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # NEXT_PUBLIC_API_URL DIBAKAR ke bundle klien saat build; mengisi
      # PUBLIC_API_URL di panel Dokploy tidak mengubah image yang sudah jadi.
      # Sebelum gerbang ini, build.yml tidak pernah meneruskan nilainya sama
      # sekali, sehingga image web di ghcr.io (hingga 08210e5) memuat default
      # Dockerfile `https://api.ionowu.example` — domain yang tidak ada. Image
      # itu lolos semua cek karena menyala normal; ia baru gagal saat kasir
      # memanggil API. Gerbang ini memastikan kegagalan terjadi di CI, bukan
      # di toko.
      - name: Gerbang URL API web
        if: steps.cek.outputs.ada == 'true' && matrix.name == 'web'
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          case "$PUBLIC_API_URL" in
            "")          echo "❌ repository variable PUBLIC_API_URL kosong"; exit 1 ;;
            *example*)   echo "❌ PUBLIC_API_URL masih domain contoh: $PUBLIC_API_URL"; exit 1 ;;
            *localhost*) echo "❌ PUBLIC_API_URL menunjuk localhost: $PUBLIC_API_URL"; exit 1 ;;
            https://*)   echo "✓ web dibangun dengan API $PUBLIC_API_URL" ;;
            *)           echo "❌ PUBLIC_API_URL wajib https://: $PUBLIC_API_URL"; exit 1 ;;
          esac

      - uses: docker/build-push-action@v7
        id: build
        if: steps.cek.outputs.ada == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # HANYA amd64. VPS produksi (srv1882569.hstgr.cloud) terkonfirmasi
          # x86_64 oleh pemilik pada 2026-09-14 — image arm64 tidak pernah
          # dipakai. Membangunnya justru berbahaya: di runner x86 arm64 jalan
          # lewat emulasi QEMU, dan langkah `pnpm install` image web di bawah
          # QEMU terbukti macet tanpa satu baris log pun — 358,8 menit pada
          # 997aab8 (dibatalkan timeout 6 jam) dan 30,8 menit pada f3fa10f —
          # sementara amd64 di run yang sama selesai dalam hitungan menit.
          # Bila suatu hari server pindah ke ARM, bangun arm64 di runner ARM
          # native (ubuntu-24.04-arm), JANGAN kembali ke QEMU.
          platforms: linux/amd64
          push: true
          # Tag SHA yang membuat rollback deterministik: tarik tag lama,
          # bukan bangun ulang dari commit lama yang tak dijamin identik.
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:main
          # IMG-08 — label OCI diisi dari konteks CI, bukan dihardcode di
          # Dockerfile (nilai default di sana hanya untuk build lokal).
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            CREATED=${{ github.event.repository.updated_at }}
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
          # IMG-12 — SBOM + provenance. Penandatanganan cosign belum aktif
          # (butuh keputusan identitas OIDC penandatangan) — lihat ADR-0008.
          sbom: true
          provenance: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # DEP-01 / DEP-08 — digest dicetak agar rilis dapat ditelusuri dan
      # deployment dapat mereferensikan digest, bukan tag yang bergerak.
      - name: Digest image
        if: steps.cek.outputs.ada == 'true'
        run: echo "${{ matrix.name }} → ${{ steps.build.outputs.digest }}"
      - name: Anggaran ukuran image
        if: steps.cek.outputs.ada == 'true'
        run: bash scripts/check-image-size.sh
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.sha }}
