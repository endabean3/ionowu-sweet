# Bangun image SETELAH merge ke main, dorong ke ghcr.io.
# PR tidak membangun image — hemat menit CI, umpan balik lebih cepat.
# Rujukan: ADR-0004 · 15-development/CI-PIPELINE.md §3

name: Build & Push
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pos-engine,          context: ./services/pos-engine }
          - { name: web,                 context: ./apps/web }
          - { name: intelligence-worker, context: ./services/intelligence-worker }
    steps:
      - uses: actions/checkout@v7
      - name: Lewati bila layanan belum ada
        id: cek
        run: |
          if [ -f "${{ matrix.context }}/Dockerfile" ]; then echo "ada=true" >> $GITHUB_OUTPUT
          else echo "⏭️  ${{ matrix.name }} belum ada"; echo "ada=false" >> $GITHUB_OUTPUT; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.cek.outputs.ada == 'true'
      - uses: docker/login-action@v4
        if: steps.cek.outputs.ada == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.cek.outputs.ada == 'true'
        with:
          context: ${{ matrix.context }}
          push: true
          # Tag SHA yang membuat rollback deterministik: tarik tag lama,
          # bukan bangun ulang dari commit lama yang tak dijamin identik.
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Anggaran ukuran image
        if: steps.cek.outputs.ada == 'true'
        run: bash scripts/check-image-size.sh
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.sha }}
