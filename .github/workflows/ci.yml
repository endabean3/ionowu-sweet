# Berjalan di setiap PR. TIDAK membangun image aplikasi — itu tugas build.yml
# setelah merge. Memisahkannya membuat umpan balik PR cepat dan hemat menit CI.
# Rujukan: 15-development/CI-PIPELINE.md §2

name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '24'

jobs:
  docs:
    name: Validasi dokumentasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tautan, tabel, blok kode
        run: make docs-check

  sql:
    name: sqlc vet — tenant scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      # Gerbang terpenting: menolak kueri tanpa tenant_id, SELECT *,
      # dan DELETE pada tabel keuangan. SECURITY §2B jadi gerbang CI.
      - run: cd 30-data && sqlc vet

  migrations:
    name: Migrasi terhadap Postgres nyata
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 3s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
      - name: goose up
        run: goose -dir 30-data/migrations postgres "$DB" up
        env: { DB: 'postgres://ci:ci@localhost:5432/ci?sslmode=disable' }
      - name: Verifikasi jumlah tabel
        run: |
          n=$(psql "$DB" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "tabel: $n"; [ "$n" -ge 47 ] || { echo "❌ harap ≥47"; exit 1; }
        env: { DB: 'postgres://ci:ci@localhost:5432/ci?sslmode=disable' }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - name: golangci-lint
        run: |
          [ -f go.mod ] || { echo "⏭️  kode Go belum ada"; exit 0; }
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...

  test-go:
    name: Uji Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: |
          [ -f go.mod ] || { echo "⏭️  kode Go belum ada"; exit 0; }
          go test ./... -race
      - name: Coverage rumus uang harus 100%
        run: bash scripts/check-money-coverage.sh

  money-parity:
    name: ⭐ Paritas rumus uang Go ↔ TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      # `pnpm install` WAJIB ada: tanpa install, direktori store tak pernah
      # dibuat dan langkah Post `cache: pnpm` gagal — job merah meski ujinya
      # lulus. Itu yang membuat gerbang ini merah pada e222ffc.
      - run: pnpm install --frozen-lockfile

      # Paritas ditegakkan dengan KEDUA sisi membaca fixture JSON yang SAMA
      # (services/pos-engine/internal/money/fixtures/). Sebelumnya job ini
      # memanggil compare-money-results.sh yang merujuk berkas tak pernah ada
      # (packages/money-testcases/cases.json), sehingga selalu `exit 0` —
      # gerbang terpenting di pipeline ini nyatanya tidak menguji apa pun.
      - name: Go — terhadap fixture bersama
        run: cd services/pos-engine && go test ./internal/money/... -v
      - name: TypeScript — terhadap fixture Go yang SAMA
        run: pnpm --filter web test

  budget:
    name: Anggaran performa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-bundle-size.sh

  secrets:
    name: Tidak ada rahasia di log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/scan-test-logs-for-secrets.sh

  e2e:
    name: Playwright E2E Offline Checkout
    runs-on: ubuntu-latest
    # Job ini SEBELUMNYA hanya memanggil `npx playwright test` tanpa menyalakan
    # apa pun — tidak ada Postgres, pos-engine, maupun Next. Ujinya gagal
    # "TypeError: fetch failed" sejak hari pertama, sehingga gerbang yang
    # seharusnya menjaga janji utama produk (kasir tetap berjualan saat
    # offline) nyatanya tidak pernah menguji apa pun.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 3s --health-retries 10
        ports: ['5432:5432']
    env:
      DB: 'postgres://ci:ci@localhost:5432/ci?sslmode=disable'
      NEXT_PUBLIC_API_URL: 'http://localhost:8080'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
      - name: Migrasi skema
        run: goose -dir 30-data/migrations postgres "$DB" up

      # Kunci Ed25519 sekali pakai, dibuat DI DALAM job. Sengaja tidak diambil
      # dari repository secrets: kunci produksi tidak boleh pernah menyentuh
      # runner CI. Format mengikuti config.go — base64 standar atas 32 byte
      # publik dan 64 byte privat (seed||public).
      - name: Kunci JWT sekali pakai
        run: |
          openssl genpkey -algorithm ed25519 -outform DER -out /tmp/k.der
          pub=$(openssl pkey -inform DER -in /tmp/k.der -pubout -outform DER | tail -c 32 | base64 -w0)
          priv=$( { tail -c 32 /tmp/k.der; openssl pkey -inform DER -in /tmp/k.der -pubout -outform DER | tail -c 32; } | base64 -w0 )
          echo "IONOWU_SWEET_JWT_PUBLIC_KEY=$pub" >> "$GITHUB_ENV"
          echo "IONOWU_SWEET_JWT_PRIVATE_KEY=$priv" >> "$GITHUB_ENV"

      # https://localhost adalah origin WebView APK Capacitor (ADR-0010),
      # bukan alamat server — ikut diuji supaya jalur APK tidak diam-diam
      # rusak oleh perubahan CORS.
      # `setsid nohup` WAJIB: proses latar yang dimulai dengan `&` saja ikut
      # mati ketika langkah (shell) berakhir, sehingga langkah berikutnya
      # menemukan port 3000/8080 kosong. Itu yang membuat percobaan pertama
      # gagal "Failed to connect to localhost port 3000".
      - name: Nyalakan pos-engine & web
        run: |
          cd services/pos-engine
          IONOWU_SWEET_DATABASE_URL="$DB" IONOWU_SWEET_CORS_ORIGINS="http://localhost:3000,https://localhost" IONOWU_SWEET_AUTH_RATE_PER_MINUTE=1000 PORT=8080 setsid nohup go run ./cmd/api > /tmp/api.log 2>&1 &
          cd "$GITHUB_WORKSPACE/apps/web"
          setsid nohup pnpm dev > /tmp/web.log 2>&1 &
          sleep 2

      - name: Tunggu keduanya benar-benar menjawab
        run: |
          ok_api=0; ok_web=0
          for i in $(seq 1 60); do
            if [ $ok_api -eq 0 ] && curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then ok_api=1; fi
            if [ $ok_web -eq 0 ] && curl -fsS -o /dev/null http://localhost:3000/login 2>/dev/null; then ok_web=1; fi
            if [ $ok_api -eq 1 ] && [ $ok_web -eq 1 ]; then break; fi
            sleep 3
          done
          if [ $ok_api -ne 1 ]; then echo "pos-engine tidak pernah siap:"; cat /tmp/api.log; exit 1; fi
          if [ $ok_web -ne 1 ]; then echo "web tidak pernah siap:"; cat /tmp/web.log; exit 1; fi
          echo "api & web siap"

      # Dijalankan DARI apps/web supaya versi playwright sama dengan dependensi
      # paket itu. `chromium` saja tidak cukup: Playwright modern meluncurkan
      # chrome-headless-shell untuk mode headless, dan binernya paket terpisah.
      - name: Install Playwright Browsers
        run: cd apps/web && npx playwright install --with-deps chromium chromium-headless-shell

      - name: Jalankan Playwright
        run: cd apps/web && CI=true npx playwright test

      - name: Log server bila gagal
        if: failure()
        run: tail -60 /tmp/api.log /tmp/web.log || true
