# Pembaruan dependensi otomatis.
#
# Rantai pasok adalah kelas ancaman yang TIDAK bisa dijaga oleh desain
# keamanan mana pun — satu paket npm/Go/PyPI yang dikompromi masuk langsung
# ke jalur uang. Dependensi yang tidak pernah diperbarui adalah kerentanan
# yang menunggu waktu.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(ci)" }

  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(docker)" }

  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(go)" }
    groups:
      go-minor: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(web)" }
    groups:
      npm-minor: { update-types: [minor, patch] }

  - package-ecosystem: uv
    directory: "/services/intelligence-worker"
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(py)" }
